<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAGE SIZE CHECK — 画像サイズ確認ツール</title>
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Limelight&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap');

  :root{
    --black:#111111;
    --line:#d8d8d8;
    --line-dark:#111111;
    --paper:#ffffff;
    --gray:#8a8a8a;
    --accent:#b8935f;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Noto Sans JP', 'Hiragino Sans', sans-serif;
    color:var(--black);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    letter-spacing:0.02em;
  }

  /* ===== Header ===== */
  header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:32px;
    max-width:1040px;
    margin:0 auto;
    padding:48px 24px;
  }
  .hero-image{
    display:block;
    height:150px;
    width:calc(150px * 250 / 312);
    max-width:40%;
    aspect-ratio:250 / 312;
    object-fit:cover;
    flex-shrink:0;
  }
  .header-text{
    text-align:left;
  }
  .kicker{
    font-size:11px;
    letter-spacing:0.4em;
    color:var(--gray);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  h1.logo{
    font-family:'Limelight', 'Noto Sans JP', sans-serif;
    font-weight:400;
    font-size:clamp(20px, 3vw, 36px);
    letter-spacing:0.02em;
    line-height:1.15;
    white-space:nowrap;
  }
  @media (max-width:640px){
    header{ flex-direction:column; padding:40px 20px; }
    .hero-image{ max-width:60%; }
    .header-text{ text-align:center; }
    h1.logo{ white-space:normal; font-size:clamp(20px, 6vw, 30px); }
  }
  main{
    max-width:1040px;
    margin:0 auto;
    padding:32px 24px 120px;
  }

  /* ===== Drop zone ===== */
  #dropzone{
    background:#f2f2f2;
    padding:70px 24px;
    text-align:center;
    cursor:pointer;
    transition:background .25s ease;
    position:relative;
  }
  #dropzone.dragover{
    background:#e8e8e8;
  }
  #dropzone .dz-mark{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:500;
    font-size:15px;
    letter-spacing:0.15em;
    margin-bottom:10px;
  }
  #dropzone .dz-sub{
    font-size:11.5px;
    color:var(--gray);
    letter-spacing:0.1em;
  }
  #fileInput{ display:none; }

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    margin-top:48px;
    margin-bottom:18px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line-dark);
  }
  .toolbar .count{
    font-size:12px;
    letter-spacing:0.15em;
    color:var(--gray);
    text-transform:uppercase;
  }
  .toolbar .count b{ color:var(--black); font-weight:700; }
  .toolbar-actions{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }
  .bulk-btn{
    background:none;
    border:1px solid var(--line-dark);
    color:var(--black);
    cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:9px 16px;
    white-space:nowrap;
    transition:background .2s ease, color .2s ease, opacity .2s ease;
  }
  .bulk-btn:hover{ background:var(--black); color:#fff; }
  .bulk-btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
    background:none;
    color:var(--black);
  }
  .clear-btn{
    background:none;
    border:none;
    font-size:11px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--black);
    cursor:pointer;
    border-bottom:1px solid var(--black);
    padding-bottom:2px;
  }
  .clear-btn:hover{ color:var(--accent); border-color:var(--accent); }

  /* ===== Quality ===== */
  .quality-toolbar{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    margin-top:32px;
    padding:20px 24px;
    background:#f7f7f7;
  }
  .quality-toolbar-label{
    font-size:11px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:500;
    white-space:nowrap;
  }
  #qualitySlider{
    flex:1;
    max-width:240px;
    accent-color:var(--black);
  }
  input.quality-value{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:16px;
    width:44px;
    text-align:right;
  }
  .quality-hint{
    font-size:11px;
    color:var(--gray);
  }

  /* ===== Fit to size ===== */
  .fit-toolbar{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    margin-top:20px;
    padding:20px 24px;
    background:#f7f7f7;
  }
  .fit-toolbar-label{
    font-size:11px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:500;
    white-space:nowrap;
  }
  .fit-toolbar-inputs{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .fit-input{ width:60px; }
  .fit-x{ color:var(--gray); font-size:14px; }

  /* ===== Table ===== */
  #results{ width:100%; overflow-x:auto; }
  .empty-msg{
    text-align:center;
    color:var(--gray);
    font-size:12px;
    letter-spacing:0.1em;
    padding:40px 0;
    display:none;
  }

  table{
    width:100%;
    border-collapse:collapse;
  }
  thead th{
    font-size:10.5px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:500;
    text-align:left;
    padding:10px 12px;
    border-bottom:1px solid var(--line-dark);
    white-space:nowrap;
  }
  tbody td{
    padding:16px 12px;
    border-bottom:1px solid var(--line);
    font-size:13px;
    vertical-align:middle;
  }
  tbody tr:hover{ background:#fafafa; }

  td.thumb-cell{ width:64px; }
  .thumb{
    width:56px;
    height:56px;
    object-fit:contain;
    background:#f7f7f7;
    display:block;
  }
  td.name-cell{ max-width:260px; }
  .fname{
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    display:block;
  }
  td.dim-cell{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.02em;
    white-space:nowrap;
  }
  td.resize-cell{ white-space:nowrap; }
  .dim-input{
    width:64px;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.02em;
    color:var(--black);
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:2px 0;
    -moz-appearance:textfield;
  }
  .dim-input::-webkit-outer-spin-button,
  .dim-input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .dim-input:focus{
    outline:none;
    border-bottom-color:var(--accent);
  }
  .dim-cell .unit, .resize-cell .unit{
    color:var(--gray);
    font-size:11px;
  }
  td.type-cell{
    color:var(--gray);
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:0.08em;
  }
  .remove-btn{
    background:none;
    border:none;
    color:var(--gray);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:4px 8px;
    transition:color .2s;
  }
  .remove-btn:hover{ color:var(--black); }

  .export-btn{
    background:none;
    border:1px solid var(--line-dark);
    color:var(--black);
    cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:7px 14px;
    white-space:nowrap;
    transition:background .2s ease, color .2s ease;
  }
  .export-btn:hover{ background:var(--black); color:#fff; }

  .compare-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--gray);
    cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:7px 14px;
    white-space:nowrap;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .compare-btn:hover{ background:var(--black); color:#fff; border-color:var(--black); }

  /* ===== Compare modal ===== */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(17,17,17,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:1000;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal-card{
    background:#fff;
    width:100%;
    max-width:880px;
    max-height:90vh;
    overflow:auto;
    padding:32px;
    position:relative;
  }
  .modal-close{
    position:absolute;
    top:16px;
    right:16px;
    background:none;
    border:none;
    font-size:24px;
    line-height:1;
    color:var(--gray);
    cursor:pointer;
  }
  .modal-close:hover{ color:var(--black); }
  .modal-title{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:15px;
    margin-bottom:24px;
    padding-right:32px;
    overflow-wrap:break-word;
  }
  .modal-compare{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
  }
  .modal-pane{
    flex:1 1 260px;
    min-width:0;
    text-align:center;
  }
  .modal-img{
    display:block;
    width:100%;
    max-height:360px;
    object-fit:contain;
    background:#f7f7f7;
    margin:0 auto 14px;
  }
  .modal-label{
    font-size:11px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--gray);
    margin-bottom:6px;
  }
  .modal-caption{
    font-family:'Noto Sans JP', sans-serif;
    font-size:13px;
    line-height:1.7;
  }
  .modal-caption b{ font-weight:700; }
  .modal-reduction{
    color:var(--accent);
    font-weight:700;
  }
  .modal-webp-hint{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--gray);
  }
  .modal-webp-hint b{
    color:var(--black);
    font-weight:700;
  }

  footer{
    text-align:center;
    padding:28px 24px;
    border-top:1px solid var(--line);
    font-size:10.5px;
    letter-spacing:0.15em;
    color:var(--gray);
    text-transform:uppercase;
  }

  @media (max-width:640px){
    #dropzone{ padding:48px 16px; }
    thead th:nth-child(3), tbody td:nth-child(3){ display:none; }
    td.name-cell{ max-width:120px; }
  }
</style>
</head>
<body>

<header>
  <img class="hero-image" id="heroImage" src="" alt="">
  <div class="header-text">
    <div class="kicker">Utility Tool</div>
    <h1 class="logo">Super Image Size Checker</h1>
  </div>
</header>

<main>
  <div id="dropzone">
    <div class="dz-mark">ここに画像ファイルをドロップ</div>
    <div class="dz-sub">またはクリックしてファイルを選択（複数選択可）</div>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <div class="quality-toolbar">
    <div class="quality-toolbar-label">Compression Quality</div>
    <input type="range" id="qualitySlider" min="10" max="100" value="90">
    <input type="number" class="dim-input quality-value" id="qualityValue" min="10" max="100" value="90"><span class="unit">%</span>
    <span class="quality-hint">(まとめてダウンロードする際の圧縮度)</span>
  </div>

  <div class="fit-toolbar">
    <div class="fit-toolbar-label">Fit to Size (白背景で収める)</div>
    <div class="fit-toolbar-inputs">
      <input type="number" class="dim-input fit-input" id="fitWidth" value="800" min="1"><span class="unit"> px</span>
      <span class="fit-x">×</span>
      <input type="number" class="dim-input fit-input" id="fitHeight" value="800" min="1"><span class="unit"> px</span>
    </div>
    <button class="bulk-btn" id="downloadAllFitBtn" disabled>Download All (Fit to Size)</button>
  </div>

  <div class="toolbar">
    <div class="count"><b id="fileCount">0</b> Files</div>
    <div class="toolbar-actions">
      <button class="bulk-btn" id="downloadAllBtn" disabled>Download All (Resized)</button>
      <button class="bulk-btn" id="downloadAllWebpBtn" disabled>Download All as WebP</button>
      <button class="clear-btn" id="clearBtn">Clear All</button>
    </div>
  </div>

  <div id="results">
    <table id="resultsTable">
      <thead>
        <tr>
          <th>Preview</th>
          <th>File Name</th>
          <th>Type</th>
          <th>Size</th>
          <th>Width</th>
          <th>Height</th>
          <th>New Width</th>
          <th>New Height</th>
          <th></th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
    <div class="empty-msg" id="emptyMsg">画像がありません</div>
  </div>
</main>

<footer>Image Size Check Tool</footer>

<div class="modal-overlay" id="compareModal" hidden>
  <div class="modal-card">
    <button class="modal-close" id="modalClose" aria-label="閉じる">×</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-compare">
      <div class="modal-pane">
        <div class="modal-label">Original</div>
        <img class="modal-img" id="modalOriginalImg" alt="">
        <div class="modal-caption" id="modalOriginalCaption"></div>
      </div>
      <div class="modal-pane">
        <div class="modal-label">Compressed Preview</div>
        <img class="modal-img" id="modalCompressedImg" alt="">
        <div class="modal-caption" id="modalCompressedCaption">生成中…</div>
        <div class="modal-webp-hint" id="modalWebpHint"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const heroImages = [
    'img/img_01_web.jpg',
    'img/img_02_web.jpg',
    'img/img_03_web.jpg',
    'img/img_04_web.jpg',
    'img/img_05_web.jpg'
  ];
  document.getElementById('heroImage').src = heroImages[Math.floor(Math.random() * heroImages.length)];

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const resultsBody = document.getElementById('resultsBody');
  const emptyMsg = document.getElementById('emptyMsg');
  const fileCount = document.getElementById('fileCount');
  const clearBtn = document.getElementById('clearBtn');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const downloadAllWebpBtn = document.getElementById('downloadAllWebpBtn');
  const downloadAllFitBtn = document.getElementById('downloadAllFitBtn');
  const fitWidthInput = document.getElementById('fitWidth');
  const fitHeightInput = document.getElementById('fitHeight');
  const qualitySlider = document.getElementById('qualitySlider');
  const qualityValue = document.getElementById('qualityValue');
  const compareModal = document.getElementById('compareModal');
  const modalClose = document.getElementById('modalClose');
  const modalTitle = document.getElementById('modalTitle');
  const modalOriginalImg = document.getElementById('modalOriginalImg');
  const modalOriginalCaption = document.getElementById('modalOriginalCaption');
  const modalCompressedImg = document.getElementById('modalCompressedImg');
  const modalCompressedCaption = document.getElementById('modalCompressedCaption');
  const modalWebpHint = document.getElementById('modalWebpHint');
  let currentCompressedUrl = null;

  qualitySlider.addEventListener('input', () => {
    qualityValue.value = qualitySlider.value;
  });

  qualityValue.addEventListener('input', () => {
    const v = parseInt(qualityValue.value, 10);
    if (!isNaN(v)) qualitySlider.value = v;
  });

  qualityValue.addEventListener('change', () => {
    qualityValue.value = qualitySlider.value;
  });

  function getQuality(){
    return parseInt(qualitySlider.value, 10) / 100;
  }

  let counter = 0;

  function formatBytes(bytes){
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function updateEmptyState(){
    const hasRows = resultsBody.children.length > 0;
    emptyMsg.style.display = hasRows ? 'none' : 'block';
    document.getElementById('resultsTable').style.display = hasRows ? 'table' : 'none';
    fileCount.textContent = resultsBody.children.length;
    downloadAllBtn.disabled = !hasRows;
    downloadAllWebpBtn.disabled = !hasRows;
    downloadAllFitBtn.disabled = !hasRows;
  }

  function addImageRow(file){
    if (!file.type.startsWith('image/')) return;

    const id = 'row-' + (++counter);
    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = function(){
      const tr = document.createElement('tr');
      tr.id = id;
      tr.dataset.ratio = img.naturalWidth / img.naturalHeight;
      tr.dataset.type = file.type;
      tr.dataset.fileName = file.name;
      tr.dataset.originalSize = file.size;
      tr.dataset.naturalWidth = img.naturalWidth;
      tr.dataset.naturalHeight = img.naturalHeight;
      const dotIndex = file.name.lastIndexOf('.');
      tr.dataset.baseName = dotIndex > 0 ? file.name.slice(0, dotIndex) : file.name;
      tr.innerHTML = `
        <td class="thumb-cell"><img class="thumb" src="${url}" alt=""></td>
        <td class="name-cell"><span class="fname" title="${file.name}">${file.name}</span></td>
        <td class="type-cell">${file.type.replace('image/', '') || '—'}</td>
        <td>${formatBytes(file.size)}</td>
        <td class="dim-cell">${img.naturalWidth}<span class="unit"> px</span></td>
        <td class="dim-cell">${img.naturalHeight}<span class="unit"> px</span></td>
        <td class="resize-cell"><input type="number" class="dim-input w-input" value="${img.naturalWidth}" min="1"><span class="unit"> px</span></td>
        <td class="resize-cell"><input type="number" class="dim-input h-input" value="${img.naturalHeight}" min="1"><span class="unit"> px</span></td>
        <td><button class="compare-btn" data-target="${id}">Compare</button></td>
        <td><button class="export-btn" data-target="${id}">Download</button></td>
        <td><button class="remove-btn" data-target="${id}" title="削除">×</button></td>
      `;
      resultsBody.appendChild(tr);
      updateEmptyState();
    };
    img.onerror = function(){
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  async function exportImage(row){
    const w = parseInt(row.querySelector('.w-input').value, 10);
    const h = parseInt(row.querySelector('.h-input').value, 10);
    if (!(w > 0) || !(h > 0)) return;

    const supportedTypes = ['image/jpeg', 'image/png', 'image/webp'];
    const mimeType = supportedTypes.includes(row.dataset.type) ? row.dataset.type : 'image/png';
    const ext = mimeType === 'image/jpeg' ? 'jpg' : mimeType === 'image/webp' ? 'webp' : 'png';
    const baseName = row.dataset.baseName || 'image';
    const thumbSrc = row.querySelector('.thumb').src;
    const quality = mimeType === 'image/png' ? undefined : getQuality();
    // Only reconstruct a name when the encoded format actually differs from
    // the original (the rare unsupported-type fallback); otherwise keep the
    // original file name exactly as-is, matching the bulk downloads.
    const outputName = mimeType === row.dataset.type ? (row.dataset.fileName || `${baseName}.${ext}`) : `${baseName}.${ext}`;

    try {
      let blob;
      if (mimeType === 'image/png' && supportsPngQuantize){
        const canvas = await drawResizedCanvas(thumbSrc, w, h);
        const { bytes } = await quantizeCanvasToPngBytes(canvas, getQuality());
        blob = new Blob([bytes], { type: 'image/png' });
      } else {
        const bytes = await resizeToBytes(thumbSrc, w, h, mimeType, quality);
        blob = new Blob([bytes], { type: mimeType });
      }
      downloadBlob(blob, outputName);
    } catch (err){
      console.error('Failed to export image', baseName, err);
    }
  }

  function closeCompareModal(){
    compareModal.hidden = true;
    if (currentCompressedUrl){
      URL.revokeObjectURL(currentCompressedUrl);
      currentCompressedUrl = null;
    }
    modalCompressedImg.src = '';
  }

  async function openCompareModal(row){
    const thumbSrc = row.querySelector('.thumb').src;
    const naturalWidth = parseInt(row.dataset.naturalWidth, 10);
    const naturalHeight = parseInt(row.dataset.naturalHeight, 10);
    const originalSize = parseInt(row.dataset.originalSize, 10);

    const w = parseInt(row.querySelector('.w-input').value, 10) || naturalWidth;
    const h = parseInt(row.querySelector('.h-input').value, 10) || naturalHeight;
    const supportedTypes = ['image/jpeg', 'image/png', 'image/webp'];
    const mimeType = supportedTypes.includes(row.dataset.type) ? row.dataset.type : 'image/jpeg';
    const quality = mimeType === 'image/png' ? undefined : getQuality();

    modalTitle.textContent = row.dataset.fileName || row.dataset.baseName || '';
    modalOriginalImg.src = thumbSrc;
    modalOriginalCaption.innerHTML =
      `<b>${naturalWidth} × ${naturalHeight}px</b><br>${formatBytes(originalSize)}`;

    if (currentCompressedUrl){
      URL.revokeObjectURL(currentCompressedUrl);
      currentCompressedUrl = null;
    }
    modalCompressedImg.src = '';
    modalCompressedCaption.textContent = '生成中…';
    modalWebpHint.textContent = '';
    compareModal.hidden = false;

    try {
      let bytes, blobType, captionExtra;

      if (mimeType === 'image/png' && supportsPngQuantize){
        const canvas = await drawResizedCanvas(thumbSrc, w, h);
        const result = await quantizeCanvasToPngBytes(canvas, getQuality());
        bytes = result.bytes;
        blobType = 'image/png';
        captionExtra = ` · ${result.paletteSize}色パレット`;
      } else {
        bytes = await resizeToBytes(thumbSrc, w, h, mimeType, quality);
        blobType = mimeType;
        captionExtra = quality !== undefined ? ` · quality ${Math.round(quality * 100)}%` : '';
      }

      const blob = new Blob([bytes], { type: blobType });
      currentCompressedUrl = URL.createObjectURL(blob);
      modalCompressedImg.src = currentCompressedUrl;

      const reduction = originalSize > 0 ? Math.round((1 - bytes.length / originalSize) * 1000) / 10 : 0;
      const reductionText = reduction >= 0 ? `${reduction}% 軽量化` : `${Math.abs(reduction)}% 増加`;
      modalCompressedCaption.innerHTML =
        `<b>${w} × ${h}px</b>${captionExtra}<br>${formatBytes(bytes.length)} <span class="modal-reduction">(${reductionText})</span>`;

      // Even with palette quantization, lossy WebP usually shrinks further —
      // show it as a reference for anyone who wants to go smaller still.
      if (mimeType === 'image/png'){
        try {
          const webpBytes = await resizeToBytes(thumbSrc, w, h, 'image/webp', getQuality());
          const webpReduction = originalSize > 0 ? Math.round((1 - webpBytes.length / originalSize) * 1000) / 10 : 0;
          modalWebpHint.innerHTML = supportsPngQuantize
            ? `さらに小さくしたい場合、WebPに変換すると <b>${formatBytes(webpBytes.length)}</b>(${webpReduction}% 軽量化)`
            : `お使いのブラウザはPNG最適化に非対応です。参考: WebPに変換すると <b>${formatBytes(webpBytes.length)}</b>(${webpReduction}% 軽量化)`;
        } catch (webpErr){
          console.error('Failed to build webp reference', webpErr);
        }
      }
    } catch (err){
      modalCompressedCaption.textContent = 'プレビューの生成に失敗しました';
      console.error('Failed to build compare preview', err);
    }
  }

  // ----- Minimal ZIP writer (store method, no compression needed since
  // images are already JPEG/PNG/WebP encoded) -----
  const CRC_TABLE = (function(){
    const table = [];
    for (let n = 0; n < 256; n++){
      let c = n;
      for (let k = 0; k < 8; k++){
        c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      }
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes){
    let crc = 0 ^ -1;
    for (let i = 0; i < bytes.length; i++){
      crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
    }
    return (crc ^ -1) >>> 0;
  }

  function dosDateTime(date){
    const dosDate = (((Math.max(date.getFullYear(), 1980) - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate()) & 0xFFFF;
    const dosTime = ((date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2)) & 0xFFFF;
    return { dosDate, dosTime };
  }

  function createZip(files){
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;
    const { dosDate, dosTime } = dosDateTime(new Date());

    files.forEach((file) => {
      const nameBytes = encoder.encode(file.name);
      const data = file.data;
      const crc = crc32(data);
      const size = data.length;

      const localHeader = new Uint8Array(30 + nameBytes.length);
      const ldv = new DataView(localHeader.buffer);
      ldv.setUint32(0, 0x04034b50, true);
      ldv.setUint16(4, 20, true);
      ldv.setUint16(6, 0, true);
      ldv.setUint16(8, 0, true);
      ldv.setUint16(10, dosTime, true);
      ldv.setUint16(12, dosDate, true);
      ldv.setUint32(14, crc, true);
      ldv.setUint32(18, size, true);
      ldv.setUint32(22, size, true);
      ldv.setUint16(26, nameBytes.length, true);
      ldv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);

      localParts.push(localHeader, data);

      const centralHeader = new Uint8Array(46 + nameBytes.length);
      const cdv = new DataView(centralHeader.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0, true);
      cdv.setUint16(10, 0, true);
      cdv.setUint16(12, dosTime, true);
      cdv.setUint16(14, dosDate, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, size, true);
      cdv.setUint32(24, size, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint16(30, 0, true);
      cdv.setUint16(32, 0, true);
      cdv.setUint16(34, 0, true);
      cdv.setUint16(36, 0, true);
      cdv.setUint32(38, 0, true);
      cdv.setUint32(42, offset, true);
      centralHeader.set(nameBytes, 46);

      centralParts.push(centralHeader);
      offset += localHeader.length + data.length;
    });

    const centralOffset = offset;
    const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);

    const eocd = new Uint8Array(22);
    const edv = new DataView(eocd.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(4, 0, true);
    edv.setUint16(6, 0, true);
    edv.setUint16(8, files.length, true);
    edv.setUint16(10, files.length, true);
    edv.setUint32(12, centralSize, true);
    edv.setUint32(16, centralOffset, true);
    edv.setUint16(20, 0, true);

    return new Blob([...localParts, ...centralParts, eocd], { type: 'application/zip' });
  }

  function resizeToBytes(thumbSrc, w, h, mimeType, quality){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => {
          if (!blob){ reject(new Error('toBlob failed')); return; }
          blob.arrayBuffer().then((buf) => resolve(new Uint8Array(buf)));
        }, mimeType, quality);
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = thumbSrc;
    });
  }

  function fitToBytes(thumbSrc, boxW, boxH, mimeType, quality){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(boxW / img.naturalWidth, boxH / img.naturalHeight);
        const drawW = Math.round(img.naturalWidth * scale);
        const drawH = Math.round(img.naturalHeight * scale);
        const offsetX = Math.round((boxW - drawW) / 2);
        const offsetY = Math.round((boxH - drawH) / 2);

        const canvas = document.createElement('canvas');
        canvas.width = boxW;
        canvas.height = boxH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, boxW, boxH);
        ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

        canvas.toBlob((blob) => {
          if (!blob){ reject(new Error('toBlob failed')); return; }
          blob.arrayBuffer().then((buf) => resolve(new Uint8Array(buf)));
        }, mimeType, quality);
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = thumbSrc;
    });
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ----- PNG palette quantization (same idea as TinyPNG/pngquant): reduce
  // millions of colors down to <=256, then write our own indexed PNG. This is
  // the only way to actually shrink a PNG, since canvas.toBlob('image/png')
  // always writes full truecolor and ignores the quality parameter. -----
  const supportsPngQuantize = typeof CompressionStream !== 'undefined';

  function loadImageElement(src){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('image load failed'));
      img.src = src;
    });
  }

  async function drawResizedCanvas(thumbSrc, w, h){
    const img = await loadImageElement(thumbSrc);
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    return canvas;
  }

  async function drawFitCanvas(thumbSrc, boxW, boxH){
    const img = await loadImageElement(thumbSrc);
    const scale = Math.min(boxW / img.naturalWidth, boxH / img.naturalHeight);
    const drawW = Math.round(img.naturalWidth * scale);
    const drawH = Math.round(img.naturalHeight * scale);
    const offsetX = Math.round((boxW - drawW) / 2);
    const offsetY = Math.round((boxH - drawH) / 2);

    const canvas = document.createElement('canvas');
    canvas.width = boxW;
    canvas.height = boxH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, boxW, boxH);
    ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
    return canvas;
  }

  // Median-cut color quantization: build a histogram of exact colors, then
  // repeatedly split the most populous bucket along its widest channel until
  // there are `maxColors` buckets, and take each bucket's weighted average
  // as a palette entry.
  //
  // Plain frequency-weighted median-cut lets a large flat background
  // out-vote small but visually critical details — a bold white headline
  // over a big solid-color banner has far fewer pixels than the background,
  // so its nearest palette entry can end up an off-white gray instead of
  // pure white. To avoid that, pure white/black get a reserved palette slot
  // whenever they're meaningfully present but not already closely matched.
  function medianCutPalette(pixels, maxColors){
    const histogram = new Map();
    for (let i = 0; i < pixels.length; i += 4){
      const key = pixels[i] * 16777216 + pixels[i + 1] * 65536 + pixels[i + 2] * 256 + pixels[i + 3];
      const entry = histogram.get(key);
      if (entry) entry.count++;
      else histogram.set(key, { r: pixels[i], g: pixels[i + 1], b: pixels[i + 2], a: pixels[i + 3], count: 1 });
    }

    const allColors = Array.from(histogram.values());
    const totalPixels = pixels.length / 4;

    const anchorCandidates = [
      { r: 255, g: 255, b: 255, a: 255 },
      { r: 0, g: 0, b: 0, a: 255 }
    ];
    const reservedAnchors = anchorCandidates.filter((anchor) => {
      let hasCloseMatch = false;
      let nearbyCount = 0;
      allColors.forEach((c) => {
        const dr = c.r - anchor.r, dg = c.g - anchor.g, db = c.b - anchor.b, da = c.a - anchor.a;
        const dist = dr * dr + dg * dg + db * db + da * da;
        if (dist < 20) hasCloseMatch = true;
        if (dist < 900) nearbyCount += c.count;
      });
      // Reserve a slot only when the anchor is meaningfully present (not a
      // stray pixel) and isn't already represented by a close-enough color.
      return !hasCloseMatch && nearbyCount / totalPixels > 0.0005;
    });

    let buckets = [allColors];
    const targetBuckets = Math.max(1, maxColors - reservedAnchors.length);

    while (buckets.length < targetBuckets){
      let targetIdx = -1;
      let targetRange = -1;
      let targetChannel = 'r';

      buckets.forEach((bucket, idx) => {
        if (bucket.length <= 1) return;
        ['r', 'g', 'b', 'a'].forEach((ch) => {
          let min = 255, max = 0;
          bucket.forEach((c) => { if (c[ch] < min) min = c[ch]; if (c[ch] > max) max = c[ch]; });
          const range = max - min;
          if (range > targetRange){
            targetRange = range;
            targetIdx = idx;
            targetChannel = ch;
          }
        });
      });

      if (targetIdx === -1) break;

      const bucket = buckets[targetIdx];
      bucket.sort((a, b) => a[targetChannel] - b[targetChannel]);

      const totalCount = bucket.reduce((sum, c) => sum + c.count, 0);
      let running = 0, splitPos = 0;
      for (; splitPos < bucket.length; splitPos++){
        running += bucket[splitPos].count;
        if (running >= totalCount / 2) break;
      }
      splitPos = Math.max(1, Math.min(bucket.length - 1, splitPos));

      buckets.splice(targetIdx, 1, bucket.slice(0, splitPos), bucket.slice(splitPos));
    }

    const palette = buckets.map((bucket) => {
      let rSum = 0, gSum = 0, bSum = 0, aSum = 0, count = 0;
      bucket.forEach((c) => {
        rSum += c.r * c.count; gSum += c.g * c.count; bSum += c.b * c.count; aSum += c.a * c.count;
        count += c.count;
      });
      return {
        r: Math.round(rSum / count), g: Math.round(gSum / count),
        b: Math.round(bSum / count), a: Math.round(aSum / count)
      };
    });

    return palette.concat(reservedAnchors);
  }

  // Map every pixel to its nearest palette entry, diffusing the quantization
  // error to neighboring pixels (Floyd-Steinberg), the same technique
  // pngquant/TinyPNG use. Because the diffused error is zero (or negligible)
  // across a genuinely flat/solid-color region, flat areas stay perfectly
  // flat — only regions that actually need it get dithered. An earlier
  // ordered (Bayer-matrix) version avoided that, but its fixed repeating
  // pattern showed up as a visible checkerboard texture on flat color
  // areas, which this avoids.
  function ditherToPalette(pixels, w, h, palette){
    const work = new Float32Array(pixels.length);
    work.set(pixels);
    const indices = new Uint8Array(w * h);

    function nearestIndex(r, g, b, a){
      let best = 0, bestDist = Infinity;
      for (let i = 0; i < palette.length; i++){
        const p = palette[i];
        const dr = r - p.r, dg = g - p.g, db = b - p.b, da = a - p.a;
        const dist = dr * dr + dg * dg + db * db + da * da;
        if (dist < bestDist){ bestDist = dist; best = i; }
      }
      return best;
    }

    function addError(x, y, er, eg, eb, ea, factor){
      if (x < 0 || x >= w || y < 0 || y >= h) return;
      const i = (y * w + x) * 4;
      work[i] += er * factor;
      work[i + 1] += eg * factor;
      work[i + 2] += eb * factor;
      work[i + 3] += ea * factor;
    }

    for (let y = 0; y < h; y++){
      for (let x = 0; x < w; x++){
        const idx = (y * w + x) * 4;
        const r = Math.max(0, Math.min(255, Math.round(work[idx])));
        const g = Math.max(0, Math.min(255, Math.round(work[idx + 1])));
        const b = Math.max(0, Math.min(255, Math.round(work[idx + 2])));
        const a = Math.max(0, Math.min(255, Math.round(work[idx + 3])));
        const pi = nearestIndex(r, g, b, a);
        indices[y * w + x] = pi;

        const p = palette[pi];
        const er = r - p.r, eg = g - p.g, eb = b - p.b, ea = a - p.a;
        addError(x + 1, y, er, eg, eb, ea, 7 / 16);
        addError(x - 1, y + 1, er, eg, eb, ea, 3 / 16);
        addError(x, y + 1, er, eg, eb, ea, 5 / 16);
        addError(x + 1, y + 1, er, eg, eb, ea, 1 / 16);
      }
    }

    return indices;
  }

  async function zlibCompress(bytes){
    const cs = new CompressionStream('deflate');
    const writer = cs.writable.getWriter();
    writer.write(bytes);
    writer.close();
    const buf = await new Response(cs.readable).arrayBuffer();
    return new Uint8Array(buf);
  }

  function pngChunk(type, data){
    const typeBytes = new TextEncoder().encode(type);
    const chunk = new Uint8Array(4 + 4 + data.length + 4);
    const dv = new DataView(chunk.buffer);
    dv.setUint32(0, data.length, false);
    chunk.set(typeBytes, 4);
    chunk.set(data, 8);
    const crcInput = new Uint8Array(4 + data.length);
    crcInput.set(typeBytes, 0);
    crcInput.set(data, 4);
    dv.setUint32(8 + data.length, crc32(crcInput), false);
    return chunk;
  }

  async function buildIndexedPng(w, h, palette, indices){
    const signature = new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]);

    const ihdrData = new Uint8Array(13);
    const ihdv = new DataView(ihdrData.buffer);
    ihdv.setUint32(0, w, false);
    ihdv.setUint32(4, h, false);
    ihdrData[8] = 8;  // bit depth
    ihdrData[9] = 3;  // color type: indexed
    const ihdr = pngChunk('IHDR', ihdrData);

    const plteData = new Uint8Array(palette.length * 3);
    palette.forEach((c, i) => {
      plteData[i * 3] = c.r; plteData[i * 3 + 1] = c.g; plteData[i * 3 + 2] = c.b;
    });
    const plte = pngChunk('PLTE', plteData);

    let lastNonOpaque = -1;
    palette.forEach((c, i) => { if (c.a < 255) lastNonOpaque = i; });
    const trns = lastNonOpaque === -1 ? new Uint8Array(0) : pngChunk('tRNS', Uint8Array.from(palette.slice(0, lastNonOpaque + 1).map((c) => c.a)));

    const stride = w + 1;
    const raw = new Uint8Array(stride * h);
    for (let y = 0; y < h; y++){
      raw[y * stride] = 0; // filter type: None
      raw.set(indices.subarray(y * w, y * w + w), y * stride + 1);
    }
    const compressed = await zlibCompress(raw);
    const idat = pngChunk('IDAT', compressed);
    const iend = pngChunk('IEND', new Uint8Array(0));

    const parts = [signature, ihdr, plte, trns, idat, iend];
    const total = parts.reduce((sum, p) => sum + p.length, 0);
    const out = new Uint8Array(total);
    let offset = 0;
    parts.forEach((p) => { out.set(p, offset); offset += p.length; });
    return out;
  }

  // quality (0.1–1.0) maps to palette size: lower quality = fewer colors = smaller file.
  async function quantizeCanvasToPngBytes(canvas, quality){
    const ctx = canvas.getContext('2d');
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const paletteSize = Math.max(2, Math.min(256, Math.round(quality * 256)));
    const palette = medianCutPalette(imageData.data, paletteSize);
    const indices = ditherToPalette(imageData.data, canvas.width, canvas.height, palette);
    const bytes = await buildIndexedPng(canvas.width, canvas.height, palette, indices);
    return { bytes, paletteSize: palette.length };
  }

  async function downloadAllResized(forceWebp){
    const rows = Array.from(resultsBody.querySelectorAll('tr'));
    if (!rows.length) return;

    const files = [];
    for (const row of rows){
      const w = parseInt(row.querySelector('.w-input').value, 10);
      const h = parseInt(row.querySelector('.h-input').value, 10);
      if (!(w > 0) || !(h > 0)) continue;

      const baseName = row.dataset.baseName || 'image';
      const thumbSrc = row.querySelector('.thumb').src;

      let mimeType;
      if (forceWebp){
        mimeType = 'image/webp';
      } else {
        const supportedTypes = ['image/jpeg', 'image/png', 'image/webp'];
        mimeType = supportedTypes.includes(row.dataset.type) ? row.dataset.type : 'image/jpeg';
      }
      const quality = mimeType === 'image/png' ? undefined : getQuality();
      // Forcing WebP changes the actual encoded format, so the extension must
      // follow; otherwise the original file name is kept exactly as-is.
      const outputName = forceWebp ? `${baseName}.webp` : (row.dataset.fileName || baseName);

      try {
        let bytes;
        if (mimeType === 'image/png' && supportsPngQuantize){
          const canvas = await drawResizedCanvas(thumbSrc, w, h);
          bytes = (await quantizeCanvasToPngBytes(canvas, getQuality())).bytes;
        } else {
          bytes = await resizeToBytes(thumbSrc, w, h, mimeType, quality);
        }
        files.push({ name: outputName, data: bytes });
      } catch (err){
        console.error('Failed to resize', baseName, err);
      }
    }

    if (!files.length) return;

    const zipBlob = createZip(files);
    downloadBlob(zipBlob, forceWebp ? 'resized-images-webp.zip' : 'resized-images.zip');
  }

  async function downloadAllFitToSize(){
    const rows = Array.from(resultsBody.querySelectorAll('tr'));
    if (!rows.length) return;

    const boxW = parseInt(fitWidthInput.value, 10);
    const boxH = parseInt(fitHeightInput.value, 10);
    if (!(boxW > 0) || !(boxH > 0)) return;

    const files = [];
    for (const row of rows){
      const baseName = row.dataset.baseName || 'image';
      const thumbSrc = row.querySelector('.thumb').src;
      const supportedTypes = ['image/jpeg', 'image/png', 'image/webp'];
      const mimeType = supportedTypes.includes(row.dataset.type) ? row.dataset.type : 'image/jpeg';
      const quality = mimeType === 'image/png' ? undefined : getQuality();
      const outputName = row.dataset.fileName || baseName;

      try {
        let bytes;
        if (mimeType === 'image/png' && supportsPngQuantize){
          const canvas = await drawFitCanvas(thumbSrc, boxW, boxH);
          bytes = (await quantizeCanvasToPngBytes(canvas, getQuality())).bytes;
        } else {
          bytes = await fitToBytes(thumbSrc, boxW, boxH, mimeType, quality);
        }
        files.push({ name: outputName, data: bytes });
      } catch (err){
        console.error('Failed to fit', baseName, err);
      }
    }

    if (!files.length) return;

    const zipBlob = createZip(files);
    downloadBlob(zipBlob, `fit-${boxW}x${boxH}-images.zip`);
  }

  function handleFiles(fileList){
    Array.from(fileList).forEach(addImageRow);
  }

  dropzone.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.remove('dragover');
    });
  });

  dropzone.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    if (dt && dt.files) handleFiles(dt.files);
  });

  resultsBody.addEventListener('input', (e) => {
    const row = e.target.closest('tr');
    if (!row) return;
    const ratio = parseFloat(row.dataset.ratio);
    if (!ratio) return;

    if (e.target.classList.contains('w-input')){
      const w = parseFloat(e.target.value);
      if (w > 0) row.querySelector('.h-input').value = Math.round(w / ratio);
    } else if (e.target.classList.contains('h-input')){
      const h = parseFloat(e.target.value);
      if (h > 0) row.querySelector('.w-input').value = Math.round(h * ratio);
    }
  });

  resultsBody.addEventListener('click', (e) => {
    if (e.target.classList.contains('remove-btn')){
      const row = document.getElementById(e.target.dataset.target);
      const img = row.querySelector('img.thumb');
      if (img) URL.revokeObjectURL(img.src);
      row.remove();
      updateEmptyState();
    } else if (e.target.classList.contains('export-btn')){
      const row = document.getElementById(e.target.dataset.target);
      if (row) exportImage(row);
    } else if (e.target.classList.contains('compare-btn')){
      const row = document.getElementById(e.target.dataset.target);
      if (row) openCompareModal(row);
    }
  });

  modalClose.addEventListener('click', closeCompareModal);
  compareModal.addEventListener('click', (e) => {
    if (e.target === compareModal) closeCompareModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !compareModal.hidden) closeCompareModal();
  });

  downloadAllBtn.addEventListener('click', () => downloadAllResized(false));
  downloadAllWebpBtn.addEventListener('click', () => downloadAllResized(true));
  downloadAllFitBtn.addEventListener('click', downloadAllFitToSize);

  clearBtn.addEventListener('click', () => {
    Array.from(resultsBody.querySelectorAll('img.thumb')).forEach(img => URL.revokeObjectURL(img.src));
    resultsBody.innerHTML = '';
    updateEmptyState();
  });

  updateEmptyState();
</script>
